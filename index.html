/* ---------- charts ---------- */
function vbar(items,{h=250,color=COL[0],fmt=compact}={}){
  const money=fmt!==compact;
  const W=640,H=h,pl=44,pr=10,pt=26,pb=70;
  const max=Math.max(...items.map(i=>i.v),1);
  const bw=(W-pl-pr)/items.length, ph=H-pt-pb;
  let g='';
  for(let k=0;k<=4;k++){const y=pt+ph*(1-k/4);g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+4}" text-anchor="end">${compact(max*k/4)}</text>`;}
  items.forEach((it,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64,bh=Math.max(ph*(it.v/max),1),y=H-pb-bh;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="6" fill="${money?'url(#gg)':(it.c||color)}"><title>${esc(it.l)}: ${fmt(it.v)}</title></rect>`;
    g+=`<text class="val${money?' amtv':''}" x="${x+w/2}" y="${y-6}" text-anchor="middle">${compact(it.v)}</text>`;
    const lx=x+w/2,ly=H-pb+14;
    g+=`<text class="axis" x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-38 ${lx} ${ly})">${esc(it.l)}</text>`;
  });
  return `<div class="geo ${money?'g':''}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d76e"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs>${g}</svg></div>`;
}
function gbar(labels,series,{h=270}={}){
  const W=640,H=h,pl=44,pr=10,pt=20,pb=70;
  const max=Math.max(...series.flatMap(s=>s.data),1);
  const ph=H-pt-pb,gw=(W-pl-pr)/labels.length,ns=series.length,bw=gw*.78/ns;
  let g='';
  for(let k=0;k<=4;k++){const y=pt+ph*(1-k/4);g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+4}" text-anchor="end">${compact(max*k/4)}</text>`;}
  labels.forEach((l,i)=>{
    const gx=pl+i*gw+gw*.11;
    series.forEach((s,j)=>{const v=s.data[i]||0,bh=Math.max(ph*(v/max),0.5),x=gx+j*bw,y=H-pb-bh;
      g+=`<rect x="${x}" y="${y}" width="${bw*.9}" height="${bh}" rx="4" fill="${s.c}"><title>${esc(l)} — ${esc(s.n)}: ${fN(v)}</title></rect>`;});
    const lx=pl+i*gw+gw/2,ly=H-pb+14;
    g+=`<text class="axis" x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-38 ${lx} ${ly})">${esc(l)}</text>`;
  });
  const leg=series.map(s=>`<span><i class="dot" style="background:${s.c}"></i>${esc(s.n)}</span>`).join('');
  const mon=series.some(s=>s.money);
  return `<div class="geo ${mon?'g':''}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div><div class="legend">${leg}</div>`;
}
function donut(items,center,centerLbl,{fmt=fN}={}){
  const money=fmt!==fN;
  const tot=items.reduce((a,b)=>a+b.v,0)||1,r=78,C=2*Math.PI*r;let off=0,segs='';
  items.forEach((it,i)=>{const len=C*(it.v/tot);
    segs+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${money?GOLD[i%GOLD.length]:(it.c||COL[i%COL.length])}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(it.l)}: ${fmt(it.v)}</title></circle>`;off+=len;});
  const leg=items.map((it,i)=>`<span><i class="dot" style="background:${money?GOLD[i%GOLD.length]:(it.c||COL[i%COL.length])}"></i>${esc(it.l)} — <b class="${money?'amt':''}">${fmt(it.v)}</b> (${pct(it.v,tot)})</span>`).join('');
  return `<div class="geo ${money?'g':''}"><div class="donut-wrap"><svg viewBox="0 0 200 200">${segs}<text class="dn-v" x="100" y="98" text-anchor="middle">${center}</text><text class="dn-l" x="100" y="118" text-anchor="middle">${centerLbl}</text></svg><div class="legend">${leg}</div></div></div>`;
}
function hbars(items,{fmt=fN,max,sub}={}){
  const money=fmt!==fN;
  const m=max||Math.max(...items.map(i=>i.v),1);
  const rows=items.map((it,i)=>{
    const isAmt=/ج\.م|مليون|ألف/.test(it.sub||'');
    const col=money?GOLD[i%GOLD.length]:(it.c||COL[i%COL.length]);
    return `<div class="hb-row"><div class="hb-l" title="${esc(it.l)}">${esc(it.l)}</div><div class="hb-t"><div class="hb-f" style="width:${Math.max(it.v/m*100,0.6).toFixed(1)}%;background:${col}"></div></div><div class="hb-v ${money?'amt':''}">${it.sub?`<span class="${isAmt?'amt':'cnt'}">${esc(it.sub)}</span>`:''}${fmt(it.v)}</div></div>`;
  }).join('');
  const scroll=items.length>10;
  return `<div class="geo ${money?'g':''}"><div class="hb ${scroll?'hb-scroll':''}">${rows}</div></div>`;
}

function table(cols,rows,{search=true,label='صف'}={}){
  const id='t'+(++TID);
  const th=cols.map((c,i)=>`<th data-i="${i}" data-num="${c.num?1:0}"><span class="lbl">${c.l}</span><span class="ar">⇅</span></th>`).join('');
  const body=rows.map(r=>`<tr>${cols.map((c,i)=>{const raw=r[c.k];const v=c.f?c.f(r):raw;return `<td class="${c.num?'n':''} ${c.cls||''}" ${c.num?`data-v="${raw}"`:''}>${v}</td>`;}).join('')}</tr>`).join('');
  return `<div>${search?`<div class="tbl-tools"><input class="srch" data-t="${id}" placeholder="بحث داخل الجدول..."><span class="cnt" id="${id}-c">${fN(rows.length)} ${label}</span></div>`:''}<div class="tbl-scroll"><table id="${id}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function initTables(){
  document.querySelectorAll('.srch').forEach(inp=>{
    const t=document.getElementById(inp.dataset.t);
    inp.oninput=()=>{const q=inp.value.trim().toLowerCase();let c=0;
      [...t.tBodies[0].rows].forEach(r=>{const s=r.textContent.toLowerCase().includes(q);r.style.display=s?'':'none';if(s)c++;});
      document.getElementById(t.id+'-c').textContent=fN(c)+' صف';};
  });
  document.querySelectorAll('table thead th').forEach(th=>{
    th.onclick=()=>{const t=th.closest('table'),i=+th.dataset.i,num=th.dataset.num==='1';
      const dir=th.dataset.dir==='desc'?'asc':'desc';th.dataset.dir=dir;
      t.querySelectorAll('thead th').forEach(x=>{x.classList.remove('sorted');x.querySelector('.ar').textContent='⇅';});
      th.classList.add('sorted');th.querySelector('.ar').textContent=dir==='asc'?'▲':'▼';
      const rows=[...t.tBodies[0].rows];
      rows.sort((a,b)=>{
        let x,y;
        if(num){x=parseFloat(a.cells[i].dataset.v)||0;y=parseFloat(b.cells[i].dataset.v)||0;}
        else{x=a.cells[i].textContent.trim();y=b.cells[i].textContent.trim();return dir==='asc'?x.localeCompare(y,'ar'):y.localeCompare(x,'ar');}
        return dir==='asc'?x-y:y-x;});
      rows.forEach(r=>t.tBodies[0].appendChild(r));};
  });
}

  const svc=donut(N.serviceType.map((x,i)=>({l:x.l,v:x.c,c:COL[i]})),compact(N.count),'إشعار');
  const svcA=donut(N.serviceType.map((x,i)=>({l:x.l,v:x.a,c:COL[i]})),mm(N.amount),'الإجمالي',{fmt:fM});
  const mC=card('الإشعارات الشهرية (العدد)',vbar(N.months.map(x=>({l:x.l,v:x.c}))));
  const mA=card('المبالغ الشهرية ',vbar(N.months.map(x=>({l:x.l,v:x.a})),{fmt:fEGP}),'المبالغ بالخط الذهبي.');
  const fac=donut(N.facilityType.map((x,i)=>({l:x.l,v:x.c,c:COL[i]})),compact(N.count),'إشعار');
  const cont=donut(N.contract.map((x,i)=>({l:x.l,v:x.c,c:[COL[1],COL[2],COL[4],COL[3]][i]})),compact(N.count),'إشعار');
  const stat=donut(N.status.map((x,i)=>({l:x.l,v:x.c,c:[COL[0],COL[4],COL[3]][i]})),compact(N.count),'إشعار');
  const tc=hbars(bySort(N.treatClass,'a').map((x,i)=>({l:x.l,v:x.a,sub:fN(x.c)+' إشعار',c:COL[i%COL.length]})),{fmt:fEGP});
  const cl=hbars(bySort(N.clinics,'a').map((x,i)=>({l:x.l,v:x.a,sub:fN(x.c)+' إشعار',c:COL[i%COL.length]})),{fmt:fEGP});
  const clT=table([
    {l:'تصنيف العيادة',k:'l',cls:'nm'},
    {l:'عدد الإشعارات',k:'c',num:1},
    {l:'إجمالي المبالغ (ج.م)',k:'a',num:1,cls:'amt',f:r=>fN(r.a)},
    {l:'النسبة من العدد',k:'c',num:1,f:r=>pct(r.c,N.count)}
  ],bySort(N.clinics,'a'),{label:'تصنيف'});
  return how([HOW_MONEY,HOW_LIST,HOW_TABLE,'الشرائط "تصنيف العيادات" تعرض كل التصنيفات (60)، ويظهر منها 10 أولاً ومرّر لرؤية الباقي.'])
  + secHead('إشعارات الأطباء والتحاليل','بيانات: الإشعارات المسجلة')
  + `<div class="kpis">${k}</div>`
  + `<div class="grid">${card('نوع الخدمة الطبية (العدد)',svc)}${card('نوع الخدمة الطبية ',svcA,'المبالغ بالخط الذهبي.')}</div>`
  + `<div class="grid">${mC}${mA}</div>`
  + `<div class="grid">${card('نوع جهة العلاج (العدد)',fac)}${card('حالة التعاقد',cont,'متعاقد = إشعار ضمن التعاقد.')}</div>`
  + `<div class="grid">${card('حالة الإشعار',stat)}${card('تصنيف جهة العلاج ',tc,HOW_LIST)}</div>`
  + card('تصنيفات العيادات  — كل التصنيفات',cl,HOW_LIST)
  + card('تفاصيل تصنيف العيادات (60 تصنيف)',clT,HOW_TABLE);
}

function renderC100(){
  const k=heroCount('إجمالي خطابات 100%',C.count,'بدون مبالغ')
   +kpi('أكبر تصنيف',fN(cMax.c),cMax.l,'g')
   +kpi('نسبة أكبر تصنيف',pct(cMax.c,C.count),'من إجمالي السجلات','')
   +kpi('المستخدم المسؤول',fN(C.users[0].c),C.users[0].l,'');
  const m=card('السجلات الشهرية',vbar(C.months.map(x=>({l:x.l,v:x.c,c:COL[3]}))));
  const t=donut(C.types.map((x,i)=>({l:x.l,v:x.c,c:COL[i]})),fN(C.count),'سجل');
  const cats=hbars(bySort(C.cats).map((x,i)=>({l:x.l,v:x.c,sub:pct(x.c,C.count),c:COL[i%COL.length]})));
  const tbl=table([
    {l:'التصنيف',k:'l',cls:'nm'},
    {l:'العدد',k:'c',num:1},
    {l:'النسبة',k:'c',num:1,f:r=>pct(r.c,C.count)}
  ],bySort(C.cats),{search:false});
  return how(['هذا التبويب يحتوي على أعداد السجلات فقط بدون مبالغ، لذلك الترتيب حسب العدد.',HOW_LIST,HOW_TABLE])
  + secHead('خطابات 100%','بيانات: خطابات 100 في 100')
  + `<div class="kpis">${k}</div>`
  + `<div class="grid">${m}${card('نوع الجهة',t)}</div>`
  + `<div class="grid">${card('التصنيفات (العدد)',cats,HOW_LIST)}${card('جدول التصنيفات',tbl,HOW_TABLE)}</div>`;
}

function renderSubs(){
  const avgSub=S.amount/S.count;
  const k=heroK('إجمالي إيرادات الاشتراكات',S.amount,fN(S.count)+' مشترك')
   +kpi('عدد المشتركين',fN(S.count),'إجمالي المشتركين (كل القنوات)','c')
   +kpi('متوسط الإيراد للمشترك',fEGP(avgSub),'إجمالي الإيرادات ÷ المشتركين','g')
   +kpi('متوقع قيد جديد حتى نهاية 2026',fN(S.expectedNew),'حسب تقرير الإدارة','w')
   +kpi('فترة البيانات',S.period[0]+' ← '+S.period[1],'البيان حتى 1/11/2026','');
  const chD=donut(bySort(S.channels,'a').map((x,i)=>({l:x.l,v:x.a,c:GOLD[i]})),mm(S.amount),'الإجمالي',{fmt:fM});
  const chB=hbars(bySort(S.channels,'a').map((x,i)=>({l:x.l,v:x.a,sub:fN(x.c)+' مشترك',c:COL[i]})),{fmt:fEGP});
  const mA=card('إيرادات الاشتراكات شهرياً ',vbar(S.monthly.map(x=>({l:x.l,v:x.a})),{fmt:fEGP}),'المبالغ بالخط الذهبي.');
  const rel=hbars(bySort(S.relations,'c').map((x,i)=>({l:x.l,v:x.c,c:COL[i%COL.length]})));
  const chT=table([
    {l:'جهة التحصيل',k:'l',cls:'nm'},
    {l:'عدد المشتركين',k:'c',num:1},
    {l:'الإيرادات (ج.م)',k:'a',num:1,cls:'amt',f:r=>fEGP(r.a)},
    {l:'متوسط الاشتراك',k:'avg',num:1,f:r=>fEGP(r.a/r.c)},
    {l:'النسبة من الإيرادات',k:'a',num:1,f:r=>pct(r.a,S.amount)}
  ],bySort(S.channels,'a').map(x=>({...x,avg:x.a/x.c})),{label:'جهة'});
  const relT=table([
    {l:'جهة التحصيل',k:'l',cls:'nm'},
    {l:'عضو',k:'r0',num:1},
    {l:'أزواج',k:'r1',num:1},
    {l:'أبناء',k:'r2',num:1},
    {l:'والدين',k:'r3',num:1},
    {l:'الإجمالي',k:'c',num:1}
  ],bySort(S.channels,'a').map(x=>({l:x.l,r0:x.rel[0],r1:x.rel[1],r2:x.rel[2],r3:x.rel[3],c:x.c,a:x.a})),{search:false});
  return how([HOW_MONEY,HOW_TABLE])
  + secHead('الاشتراكات','بيانات: احصائية اشتراكات الرعاية الصحية')
  + `<div class="kpis">${k}</div>`
  + `<div class="grid">${card('الإيرادات حسب جهة التحصيل',chD)}${card('جهات التحصيل ',chB,HOW_LIST)}</div>`
  + card('إيرادات الاشتراكات شهرياً (ديسمبر 2025 – أكتوبر 2026)',mA)
  + `<div class="grid">${card('المشتركون حسب درجة القرابة (العدد)',rel,'مرتبة حسب العدد لعدم توفر مبالغ مفصلة.')}${card('جهات التحصيل (تفاصيل)',chT,HOW_TABLE)}</div>`
  + card('توزيع درجات القرابة لكل جهة تحصيل (العدد)',relT,HOW_TABLE);
}


function countUp(el,to,fmt,dur=900){const t0=performance.now();function step(now){const p=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('button,th,.kpi,.card,.hb-row');if(!el)return;el.classList.add('press');const rm=()=>el.classList.remove('press');el.addEventListener('pointerup',rm,{once:true});el.addEventListener('pointerleave',rm,{once:true});el.addEventListener('pointercancel',rm,{once:true});});

/* ---------- boot ---------- */
go('over');
